# 증적 파서 픽스처: 통과 플로우 뒤에 없는 요소를 누르게 해 실패시킨다.
appId: com.android.settings
name: fixture Android 설정 검색 실패
---
# 설정 검색 화면은 별도 패키지라 설정 앱을 다시 띄워도 남는다. 먼저 닫는다.
- stopApp: com.google.android.settings.intelligence
- launchApp
- extendedWaitUntil:
    visible:
      id: ".*search_action_bar"
    timeout: 30000
- tapOn:
    id: ".*search_action_bar"
- extendedWaitUntil:
    visible:
      id: ".*open_search_view_edit_text"
    timeout: 15000
- inputText: ${QA_FIXTURE_ACCOUNT_ID}
- takeScreenshot: 01_search_typed
- tapOn:
    text: "${QA_FIXTURE_ACCOUNT_ID} 없음"
